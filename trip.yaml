# Settings. The trip itself (dates, cities, flights) comes from your Google Sheet.
trip:
  name: "Elliot · Asia 2027"
  currency: CAD
  start: 2027-06-06          # only plan this part of the sheet (Cat continues to Europe after)
  end: 2027-07-12
  home: Toronto              # where your last flight should land

sheet:
  # Leave blank and set the TRIP_SHEET_URL secret on GitHub instead (keeps the link private).
  url: ""
  # The table in the flights tab the tool tracks, and updates every Sunday
  # (Cost / Length / Flight Number / Notes). Rows marked Booked are left alone.
  my_flights_table: "Elliot Flights"

search:
  flex_days: 2               # also price flights up to this many days before/after your planned date
  # Each flight date/route or hotel = 1 search. Make 4-5 weekly runs fit your SerpApi monthly limit.
  # ~45 covers every flight as planned, ±1 day, the routes the checks flag, and every hotel.
  # Raise it to also try ±2 days and nearby airports.
  max_searches_per_run: 45
  suggest_if_saves: 30       # only suggest a change if it saves at least this much per person

hotels:
  min_nights: 2              # skip one-night stopovers
  adults: 2
  skip: [Toronto, Vancouver, Manila]
  max_price_per_night:       # by country, for the room
    Japan: 250
    Thailand: 150
    Indonesia: 180
    Vietnam: 120
    Greece: 250
    Croatia: 250
  areas:                     # where in each city to look (otherwise just the city name)
    Tokyo: "Shinjuku, Tokyo"
    Bangkok: "Sukhumvit, Bangkok"
    Bali: "Canggu, Bali"
    Hanoi: "Old Quarter, Hanoi"
    Split: "Split Old Town"
  typical_price:             # only used for demo data
    Japan: 180
    Thailand: 80
    Indonesia: 100
    Vietnam: 60
    Greece: 170
    Croatia: 160
