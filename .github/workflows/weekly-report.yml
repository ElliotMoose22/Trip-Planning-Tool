name: Weekly price report

on:
  schedule:
    - cron: "17 12 * * 0"   # Sundays ~8am Toronto
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check prices and build report
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python -m triptool run
      - name: Post summary
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save price history + report
        run: |
          git config user.name "trip-bot"
          git config user.email "trip-bot@users.noreply.github.com"
          git add data/prices.db reports/
          git commit -m "Weekly price report $(date +%F)" || echo "no changes"
          git push
