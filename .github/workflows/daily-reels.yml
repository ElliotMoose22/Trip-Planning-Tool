name: Daily reels

on:
  schedule:
    - cron: "0 5 * * *"   # midnight Toronto (1am in summer time); GitHub may start it a few minutes late
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install ffmpeg (takes frames from each reel)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Claude Code (reads each reel's caption)
        run: npm i -g @anthropic-ai/claude-code
      - name: Place new reels on the trip
        env:
          TRIP_SHEET_URL: ${{ secrets.TRIP_SHEET_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python -m triptool reels
      - name: Save map data
        run: |
          git config user.name "trip-bot"
          git config user.email "trip-bot@users.noreply.github.com"
          git add reports/plan.json
          git commit -m "Reels $(date +%F)" || echo "no changes"
          git push
